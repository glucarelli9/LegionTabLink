<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GL ExtraScreen</title>
<style>
:root{
  --bg:#09090f; --bg2:#0f0f18; --card:rgba(255,255,255,.035); --card-b:rgba(255,255,255,.07);
  --text:#ececf4; --sub:#8a8aa3; --dim:#5d5d74;
  --accent:#6d6af7; --accent2:#a855f7; --cyan:#22d3ee;
  --ok:#34d399; --warn:#fbbf24; --idle:#5d5d74; --danger:#f43f5e;
  --state:var(--idle);
  --radius:18px;
  --font:"Segoe UI Variable Display","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --mono:"Cascadia Mono","Cascadia Code",Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text); font-family:var(--font); font-size:14px;
  -webkit-font-smoothing:antialiased; user-select:none; overflow-x:hidden; overflow-y:auto;
}
body::before,body::after{
  content:""; position:fixed; border-radius:50%; filter:blur(90px); pointer-events:none; z-index:0;
  transition:background 1.2s ease, opacity 1.2s ease;
}
body::before{width:420px;height:420px;top:-220px;left:-120px;background:radial-gradient(circle,var(--accent) 0%,transparent 70%);opacity:.38}
body::after{width:380px;height:380px;bottom:-240px;right:-140px;background:radial-gradient(circle,var(--accent2) 0%,transparent 70%);opacity:.22}
body[data-kind="live"]::after{background:radial-gradient(circle,var(--ok) 0%,transparent 70%);opacity:.20}
::-webkit-scrollbar{width:10px} ::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:10px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.16)}

.wrap{position:relative;z-index:1;padding:22px 22px 18px;display:flex;flex-direction:column;gap:16px;min-height:100%}

/* header */
header{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 8px 24px -8px var(--accent)}
.logo svg{width:24px;height:24px}
.brand h1{font-size:19px;font-weight:700;letter-spacing:-.2px}
.brand p{font-size:12px;color:var(--sub);margin-top:1px}
.lang{margin-left:auto;display:flex;padding:3px;border-radius:10px;background:var(--card);border:1px solid var(--card-b)}
.lang button{all:unset;cursor:pointer;font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:7px;color:var(--sub);transition:.2s}
.lang button.on{background:rgba(255,255,255,.09);color:var(--text)}
.lang button:not(.on):hover{color:var(--text)}

/* hero */
.card{background:var(--card);border:1px solid var(--card-b);border-radius:var(--radius);backdrop-filter:blur(14px)}
.hero{padding:22px 20px 20px;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 70% at 50% 0%,color-mix(in srgb,var(--state) 16%,transparent),transparent 60%);transition:background .8s}
.scene{position:relative;width:300px;height:120px}
.scene svg{width:100%;height:100%;overflow:visible}
.dev{fill:rgba(255,255,255,.03);stroke:rgba(255,255,255,.22);stroke-width:1.6}
.screen{transition:fill .8s}
.link{stroke:var(--state);stroke-width:2;stroke-dasharray:3 7;stroke-linecap:round;opacity:.35;transition:stroke .8s,opacity .8s}
body[data-kind="live"] .link,body[data-kind="ok"] .link,body[data-kind="warn"] .link{opacity:.9;animation:flow .8s linear infinite}
body[data-kind="ok"] .link,body[data-kind="warn"] .link{animation-duration:1.6s;opacity:.55}
@keyframes flow{to{stroke-dashoffset:-20}}
.packet{fill:var(--state);opacity:0}
body[data-kind="live"] .packet{animation:packet 1.4s cubic-bezier(.5,0,.5,1) infinite}
body[data-kind="live"] .packet.p2{animation-delay:.47s} body[data-kind="live"] .packet.p3{animation-delay:.94s}
@keyframes packet{0%{opacity:0;transform:translateX(0)}15%{opacity:1}85%{opacity:1}100%{opacity:0;transform:translateX(96px)}}
.mirror{opacity:0;transition:opacity .8s}
body[data-kind="live"] .mirror{opacity:1}

.chip{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:6px 12px 6px 10px;border-radius:999px;
  background:color-mix(in srgb,var(--state) 12%,transparent);border:1px solid color-mix(in srgb,var(--state) 30%,transparent);
  font-size:12px;font-weight:600;color:color-mix(in srgb,var(--state) 75%,white);transition:.6s}
.dot{width:8px;height:8px;border-radius:50%;background:var(--state);box-shadow:0 0 0 0 var(--state);transition:background .6s}
body:not([data-kind="idle"]) .dot{animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--state) 70%,transparent)}100%{box-shadow:0 0 0 10px transparent}}
.status{font-size:20px;font-weight:700;margin-top:12px;letter-spacing:-.2px;min-height:26px}
.hint{font-size:12.5px;color:var(--sub);margin-top:4px;min-height:17px}

/* button */
.cta{all:unset;box-sizing:border-box;cursor:pointer;width:100%;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:10px;
  font-weight:650;font-size:15px;color:#fff;position:relative;
  background:linear-gradient(100deg,var(--accent),var(--accent2));
  box-shadow:0 10px 30px -10px var(--accent),inset 0 1px 0 rgba(255,255,255,.18);
  transition:transform .15s,box-shadow .25s,filter .25s}
.cta:hover{filter:brightness(1.1);box-shadow:0 14px 34px -10px var(--accent2),inset 0 1px 0 rgba(255,255,255,.22)}
.cta:active{transform:scale(.985)}
.cta:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.cta svg{width:18px;height:18px}
.cta.stop{background:rgba(244,63,94,.10);color:#fda4af;box-shadow:inset 0 0 0 1px rgba(244,63,94,.35)}
.cta.stop:hover{background:rgba(244,63,94,.16);filter:none}
.cta[disabled]{opacity:.55;pointer-events:none}

/* meta line */
.meta{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:14px;position:relative}
.meta span{font-size:11.5px;font-weight:600;color:var(--sub);padding:4px 9px;border-radius:8px;background:rgba(255,255,255,.04);font-variant-numeric:tabular-nums}

/* quality */
.quality{padding:12px}
.qhead{display:flex;align-items:baseline;justify-content:space-between;padding:2px 4px 10px;font-size:12px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.7px}
.qnote{font-size:11px;text-transform:none;letter-spacing:0;color:var(--dim);font-weight:500}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:4px;border-radius:12px;background:rgba(0,0,0,.25)}
.seg button{all:unset;cursor:pointer;text-align:center;padding:9px 6px;border-radius:9px;transition:background .2s,box-shadow .2s}
.seg button b{display:block;font-size:13px;font-weight:650;color:var(--sub);transition:color .2s}
.seg button span{display:block;font-size:11px;color:var(--dim);margin-top:2px}
.seg button:hover b{color:var(--text)}
.seg button.on{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 30%,transparent),color-mix(in srgb,var(--accent2) 22%,transparent));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 45%,transparent)}
.seg button.on b{color:#fff} .seg button.on span{color:#c9c8ff}
.seg button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

/* collapsibles */
details{overflow:hidden}
summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:14px 16px;font-weight:600;font-size:13.5px}
summary::-webkit-details-marker{display:none}
summary .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:rgba(255,255,255,.05);color:var(--sub)}
summary .ic svg{width:15px;height:15px}
summary .chev{margin-left:auto;color:var(--dim);transition:transform .25s}
details[open] summary .chev{transform:rotate(180deg)}
summary .badge{font-size:11px;color:var(--dim);font-weight:600;margin-left:auto}
summary .badge + .chev{margin-left:8px}
.steps{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.step{display:flex;gap:12px;align-items:flex-start}
.step .n{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;
  background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 35%,transparent),color-mix(in srgb,var(--accent2) 35%,transparent));color:#d9d8ff}
.step b{display:block;font-size:13px;font-weight:600}
.step span{display:block;font-size:12px;color:var(--sub);margin-top:2px}
.log{margin:0 12px 12px;height:150px;overflow-y:auto;padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.35);
  font-family:var(--mono);font-size:11.5px;line-height:1.55;color:#a3a3bd;user-select:text;white-space:pre-wrap;word-break:break-all}
.log .err{color:#fda4af} .log .ok{color:#6ee7b7} .log .tag{color:#8b89ff}
.logtools{display:flex;justify-content:flex-end;gap:6px;margin:0 12px 12px}
.ghost{all:unset;cursor:pointer;font-size:11.5px;font-weight:600;color:var(--sub);padding:5px 10px;border-radius:8px;background:rgba(255,255,255,.04)}
.ghost:hover{color:var(--text);background:rgba(255,255,255,.08)}

footer{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--dim);padding:2px 4px 0}
footer a{color:var(--sub);text-decoration:none;cursor:pointer} footer a:hover{color:var(--text)}

.fade{animation:fadein .5s ease both} .fade:nth-child(2){animation-delay:.04s}.fade:nth-child(3){animation-delay:.08s}.fade:nth-child(4){animation-delay:.12s}.fade:nth-child(5){animation-delay:.16s}.fade:nth-child(6){animation-delay:.2s}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-kind="idle">
<div class="wrap">
  <header class="fade">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="4" width="13" height="10" rx="1.6"/><path d="M5 18h7"/><rect x="17" y="7" width="5" height="11" rx="1.2"/>
      </svg>
    </div>
    <div class="brand"><h1>GL ExtraScreen</h1><p data-i="tagline"></p></div>
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="es">ES</button><button data-lang="en">EN</button>
    </div>
  </header>

  <section class="card hero fade">
    <div class="scene">
      <svg viewBox="0 0 300 120" aria-hidden="true">
        <defs>
          <linearGradient id="scr" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#6d6af7" stop-opacity=".55"/><stop offset="1" stop-color="#a855f7" stop-opacity=".35"/>
          </linearGradient>
        </defs>
        <!-- laptop -->
        <rect class="dev" x="20" y="14" width="118" height="76" rx="7"/>
        <rect class="screen" x="27" y="21" width="104" height="62" rx="3" fill="url(#scr)"/>
        <rect x="38" y="31" width="40" height="5" rx="2.5" fill="rgba(255,255,255,.35)"/>
        <rect x="38" y="41" width="70" height="4" rx="2" fill="rgba(255,255,255,.18)"/>
        <rect x="38" y="50" width="56" height="4" rx="2" fill="rgba(255,255,255,.18)"/>
        <path class="dev" d="M8 96h142l-8 8H16z"/>
        <!-- link -->
        <line class="link" x1="146" y1="58" x2="226" y2="58"/>
        <circle class="packet p1" cx="146" cy="58" r="3"/>
        <circle class="packet p2" cx="146" cy="58" r="3"/>
        <circle class="packet p3" cx="146" cy="58" r="3"/>
        <!-- tablet -->
        <rect class="dev" x="232" y="20" width="60" height="86" rx="8"/>
        <rect class="screen" x="238" y="27" width="48" height="72" rx="3" fill="rgba(255,255,255,.04)"/>
        <g class="mirror">
          <rect x="238" y="27" width="48" height="72" rx="3" fill="url(#scr)"/>
          <rect x="244" y="35" width="22" height="4" rx="2" fill="rgba(255,255,255,.35)"/>
          <rect x="244" y="43" width="34" height="3.5" rx="1.75" fill="rgba(255,255,255,.18)"/>
          <rect x="244" y="50" width="28" height="3.5" rx="1.75" fill="rgba(255,255,255,.18)"/>
        </g>
      </svg>
    </div>
    <div class="chip"><span class="dot"></span><span id="chip"></span></div>
    <div class="status" id="status"></div>
    <div class="hint" id="hint"></div>
    <div class="meta" id="meta"></div>
  </section>

  <button class="cta fade" id="cta"></button>

  <section class="card quality fade">
    <div class="qhead"><span data-i="quality"></span><span class="qnote" id="qnote"></span></div>
    <div class="seg" id="seg" role="radiogroup">
      <button data-q="0" role="radio"><b data-i="q0"></b><span>90 FPS</span></button>
      <button data-q="1" role="radio"><b data-i="q1"></b><span>60 FPS</span></button>
      <button data-q="2" role="radio"><b data-i="q2"></b><span>60 FPS · HD</span></button>
    </div>
  </section>

  <details class="card fade" id="setup">
    <summary>
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 8v4l3 2"/><circle cx="12" cy="12" r="9"/></svg></span>
      <span data-i="setupTitle"></span>
      <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
    </summary>
    <div class="steps" id="steps"></div>
  </details>

  <details class="card fade" id="logbox">
    <summary>
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m5 8 4 4-4 4M12 16h7"/></svg></span>
      <span data-i="log"></span>
      <span class="badge" id="logcount"></span>
      <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
    </summary>
    <div class="log" id="log"></div>
    <div class="logtools"><button class="ghost" id="copy" data-i="copy"></button><button class="ghost" id="clear" data-i="clear"></button></div>
  </details>

  <footer><span>v1.2 · Gianfranco Lucarelli</span><a id="gh">GitHub ↗</a></footer>
</div>

<script>
const T = {
  es:{tagline:"Tu tablet como segundo monitor",quality:"Calidad",q0:"Fluido",q1:"Equilibrado",q2:"Nítido",
      qIdle:"Se usa al iniciar",qLive:"Cambiarla reinicia la transmisión",
      start:"Iniciar servidor",stop:"Detener servidor",setupTitle:"Configurar la tablet (primera vez)",log:"Registro",copy:"Copiar",clear:"Limpiar",copied:"Copiado",
      chip:{idle:"Inactivo",warn:"Preparando",ok:"Esperando tablet",live:"En vivo"},
      title:{idle:"Listo para conectar"},
      hint:{idle:"Conectá la tablet por USB y tocá Iniciar",warn:"Creando la pantalla virtual…",ok:"Abriendo la app en la tablet…",live:"Tocá, dibujá o usá el lápiz en la tablet"},
      steps:[["Activá las Opciones de desarrollador","Ajustes → Información de la tablet → tocá 7 veces Número de compilación"],
             ["Activá la Depuración USB","Ajustes → Opciones de desarrollador → Depuración USB"],
             ["Conectá la tablet con el cable USB","Usá un cable de datos, no solo de carga"],
             ["Aceptá el aviso en la tablet","Marcá “Permitir siempre desde esta computadora”"]]},
  en:{tagline:"Your tablet as a second monitor",quality:"Quality",q0:"Smooth",q1:"Balanced",q2:"Sharp",
      qIdle:"Used when the server starts",qLive:"Changing it restarts the stream",
      start:"Start server",stop:"Stop server",setupTitle:"Set up the tablet (first time)",log:"Log",copy:"Copy",clear:"Clear",copied:"Copied",
      chip:{idle:"Idle",warn:"Preparing",ok:"Waiting for tablet",live:"Live"},
      title:{idle:"Ready to connect"},
      hint:{idle:"Plug the tablet in via USB and press Start",warn:"Creating the virtual display…",ok:"Opening the app on the tablet…",live:"Touch, draw or use the pen on the tablet"},
      steps:[["Enable Developer Options","Settings → About tablet → tap Build number 7 times"],
             ["Enable USB Debugging","Settings → Developer Options → USB debugging"],
             ["Connect the tablet with a USB cable","Use a data cable, not a charge-only one"],
             ["Accept the prompt on the tablet","Tick “Always allow from this computer”"]]}
};
const COLORS = {idle:"var(--idle)",warn:"var(--warn)",ok:"var(--accent)",live:"var(--ok)"};
const S = {lang:"es",running:false,kind:"idle",text:"",w:0,h:0,fps:0,br:0,q:1,liveSince:0,lines:0};
const $ = id => document.getElementById(id);
const host = window.chrome && window.chrome.webview;
const send = m => host && host.postMessage(m);

function t(){ return T[S.lang]; }
function render(){
  const L = t();
  document.documentElement.lang = S.lang;
  document.body.dataset.kind = S.kind;
  document.body.style.setProperty("--state", COLORS[S.kind]);
  document.querySelectorAll("[data-i]").forEach(e => e.textContent = L[e.dataset.i]);
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.lang === S.lang));
  $("chip").textContent = L.chip[S.kind];
  $("status").textContent = (S.kind !== "idle" && S.text) || L.title[S.kind] || L.chip[S.kind];
  $("hint").textContent = L.hint[S.kind];
  const cta = $("cta");
  cta.classList.toggle("stop", S.running);
  cta.innerHTML = (S.running
    ? '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l11-6.5a1 1 0 0 0 0-1.72l-11-6.5A1 1 0 0 0 8 5.5z"/></svg>')
    + `<span>${S.running ? L.stop : L.start}</span>`;
  document.querySelectorAll(".seg button").forEach(b => {
    const on = Number(b.dataset.q) === S.q; b.classList.toggle("on", on); b.setAttribute("aria-checked", on); });
  $("qnote").textContent = S.running ? L.qLive : L.qIdle;
  $("steps").innerHTML = L.steps.map((s,i) =>
    `<div class="step"><div class="n">${i+1}</div><div><b>${s[0]}</b><span>${s[1]}</span></div></div>`).join("");
  tick();
}
function tick(){
  const parts = [];
  if (S.w) parts.push(`${S.w} × ${S.h}`);
  if (S.fps) parts.push(`${S.fps} FPS`);
  if (S.br) parts.push(`${S.br} Mbps`);
  if (S.kind === "live" && S.liveSince){
    const s = Math.floor((Date.now() - S.liveSince)/1000);
    const mm = String(Math.floor(s/60)%60).padStart(2,"0"), ss = String(s%60).padStart(2,"0");
    parts.push(s >= 3600 ? `${Math.floor(s/3600)}h ${mm}m` : `${mm}:${ss}`);
  }
  const html = parts.map(p => `<span>${p}</span>`).join("");
  if ($("meta").innerHTML !== html) $("meta").innerHTML = html;
}
setInterval(tick, 1000);

function addLog(line){
  const box = $("log");
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 24;
  const div = document.createElement("div");
  const m = line.match(/^(\[[^\]]+\])\s?(.*)$/);
  if (/error|fail|not found|no se/i.test(line)) div.className = "err";
  else if (/connected!|ready|launched|restored|configured/i.test(line)) div.className = "ok";
  if (m){ const tag = document.createElement("span"); tag.className = "tag"; tag.textContent = m[1] + " "; div.append(tag, m[2]); }
  else div.textContent = line;
  box.append(div);
  while (box.childElementCount > 600) box.firstElementChild.remove();
  if (atBottom) box.scrollTop = box.scrollHeight;
  $("logcount").textContent = ++S.lines;
}

if (host) host.addEventListener("message", e => {
  const m = e.data;
  if (m.t === "state"){ Object.assign(S, {lang:m.lang, running:m.running, w:m.w, h:m.h, fps:m.fps, br:m.br, q:m.q});
    if (!m.running){ S.kind = "idle"; S.text = m.text || ""; } render(); }
  else if (m.t === "status"){
    if (m.kind === "live" && S.kind !== "live") S.liveSince = Date.now();
    S.kind = m.kind; S.text = m.text; render(); }
  else if (m.t === "log") addLog(m.line);
});

$("cta").onclick = () => { $("cta").disabled = true; setTimeout(() => $("cta").disabled = false, 900); send("toggle"); };
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => { if (b.dataset.lang !== S.lang) send("lang:" + b.dataset.lang); });
$("gh").onclick = () => send("open:github");
document.querySelectorAll(".seg button").forEach(b => b.onclick = () => {
  const q = Number(b.dataset.q); if (q === S.q) return; S.q = q; render(); send("quality:" + q); });
$("clear").onclick = e => { e.preventDefault(); $("log").innerHTML = ""; S.lines = 0; $("logcount").textContent = ""; };
$("copy").onclick = e => { e.preventDefault(); send("copy:" + $("log").innerText);
  const b = $("copy"); b.textContent = t().copied; setTimeout(() => b.textContent = t().copy, 1200); };
document.addEventListener("contextmenu", e => { if (!e.target.closest(".log")) e.preventDefault(); });
document.addEventListener("keydown", e => { if (e.ctrlKey && /^[+\-=0]$/.test(e.key)) e.preventDefault(); });

render();
send("ready");
</script>
</body>
</html>
